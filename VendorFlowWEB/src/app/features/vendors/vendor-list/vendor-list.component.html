<div class="page">
  <app-page-header [title]="settings.vendors" [subtitle]="'Onboard, approve and manage your vendors.'">
    <button class="btn" (click)="exportCsv()"><span class="material-icons-outlined">download</span> Export CSV</button>
    @if (auth.has('vendors.create')) {
      <a class="btn primary" routerLink="/vendors/new"><span class="material-icons-outlined">add</span> {{ 'Add Vendor' | labels }}</a>
    }
  </app-page-header>

  <div class="tabs">
    @for (t of tabs; track t.key) {
      <button [class.active]="query.status === t.key" (click)="setTab(t.key)">{{ t.label }} <span class="count">{{ counts[t.countKey] ?? 0 }}</span></button>
    }
  </div>

  <div class="filters">
    <input class="search" [value]="query.search" [placeholder]="'Search by name, GSTIN, category...'"
           (input)="setText('search', $any($event.target).value)" (keyup.enter)="onFilterChange()" />
    <select (change)="setSelect('category', $any($event.target).value)">
      <option value="">Category</option>
      @for (c of categories; track c) { <option [value]="c" [selected]="c === query.category">{{ c }}</option> }
    </select>
    <select (change)="setSelect('risk', $any($event.target).value)">
      <option value="">Risk</option>
      <option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option>
    </select>
    <button class="btn" (click)="onFilterChange()">Search</button>
  </div>

  <div class="card flush">
    <app-data-table [columns]="columns" [rows]="rows" [totalCount]="total" [page]="query.page" [pageSize]="query.pageSize"
      [loading]="loading" [sortKey]="query.sortBy" [sortDir]="query.sortDir" linkTemplate="/vendors/:id"
      emptyText="No vendors match your filters." (pageChange)="onPage($event)" (sortChange)="onSort($event)" />
  </div>
</div>
