<div class="page">
  <app-page-header title="RFQs" subtitle="Ask vendors for quotations and follow their responses.">
    @if (auth.has('rfqs.manage')) { <a class="btn primary" routerLink="/rfqs/new"><span class="material-icons-outlined">add</span> New RFQ</a> }
  </app-page-header>

  <div class="tabs">
    @for (t of tabs; track t.key) {
      <button [class.active]="query.status === t.key" (click)="setTab(t.key)">{{ t.label }} <span class="count">{{ counts[t.key || 'All'] ?? 0 }}</span></button>
    }
  </div>
  <div class="filters">
    <input class="search" placeholder="Search RFQ number or title..." [value]="query.search" (input)="setSearch($any($event.target).value)" (keyup.enter)="search()" />
    <button class="btn" (click)="search()">Search</button>
  </div>

  <div class="card flush">
    <app-data-table [columns]="columns" [rows]="rows" [totalCount]="total" [page]="query.page" [pageSize]="query.pageSize" [loading]="loading"
      [sortKey]="query.sortBy" [sortDir]="query.sortDir" linkTemplate="/rfqs/:id" emptyText="No RFQs found." (pageChange)="onPage($event)" (sortChange)="onSort($event)" />
  </div>
</div>
